<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yt-grabber</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>yt-grabber</h1>
      <p class="subtitle">Download YouTube videos and audio</p>
    </header>

    <!-- ── Part 1: Download ── -->
    <section class="card" id="section-download">
      <h2>Download</h2>

      <!-- URL input -->
      <div class="input-row">
        <input
          type="text"
          id="url-input"
          placeholder="Paste YouTube URL here..."
          autocomplete="off"
        />
        <button id="btn-info" class="btn-primary">Get Info</button>
      </div>

      <!-- Video preview -->
      <div id="video-preview" class="hidden">
        <div class="preview-inner">
          <img id="preview-thumb" src="" alt="thumbnail" />
          <div class="preview-meta">
            <p id="preview-title" class="preview-title"></p>
            <p id="preview-uploader" class="preview-sub"></p>
            <p id="preview-duration" class="preview-sub"></p>
          </div>
        </div>
      </div>

      <!-- Type toggle -->
      <div id="type-row" class="type-row hidden">
        <label class="radio-label">
          <input type="radio" name="dl-type" value="video" checked /> Video (mp4)
        </label>
        <label class="radio-label">
          <input type="radio" name="dl-type" value="audio" /> Audio (mp3)
        </label>
      </div>

      <!-- Quality select -->
      <div id="quality-row" class="quality-row hidden">
        <label for="quality-select">Quality</label>
        <select id="quality-select"></select>
      </div>

      <!-- Download button -->
      <div id="download-row" class="hidden">
        <button id="btn-download" class="btn-primary">Download</button>
      </div>

      <!-- Progress -->
      <div id="progress-row" class="hidden">
        <div class="progress-bar-wrap">
          <div id="progress-bar" class="progress-bar" style="width:0%"></div>
        </div>
        <span id="progress-label">0%</span>
      </div>

      <!-- Save -->
      <div id="save-row" class="hidden">
        <span id="save-status" class="save-status">✓ Done</span>
        <a id="save-link" href="#" class="btn-secondary">Save to disk</a>
        <button id="btn-new" class="btn-ghost">Download another</button>
      </div>

      <!-- Error -->
      <div id="error-row" class="hidden">
        <p id="error-msg" class="error-msg"></p>
      </div>
    </section>

    <!-- ── Part 2: Transcribe ── -->
    <section class="card" id="section-transcribe">
      <h2>Transcribe</h2>

      <!-- File select -->
      <div class="select-row">
        <label for="file-select">File</label>
        <select id="file-select">
          <option value="">— select a downloaded file —</option>
        </select>
        <button id="btn-refresh-files" class="btn-ghost" title="Refresh list">↻</button>
      </div>

      <!-- Model select -->
      <div class="select-row">
        <label for="model-select">Model</label>
        <select id="model-select">
          <option value="tiny">tiny — fastest</option>
          <option value="base" selected>base — recommended</option>
          <option value="small">small — better accuracy</option>
          <option value="medium">medium — most accurate</option>
        </select>
      </div>

      <!-- Transcribe button -->
      <div>
        <button id="btn-transcribe" class="btn-primary">Transcribe</button>
      </div>

      <!-- Spinner -->
      <div id="tr-progress-row" class="hidden">
        <div class="spinner"></div>
        <span class="muted">Transcribing… this may take a while</span>
      </div>

      <!-- Result -->
      <div id="tr-result-row" class="hidden">
        <textarea id="tr-textarea" readonly placeholder="Transcript will appear here…"></textarea>
        <div class="export-row">
          <span class="save-status">✓ Done</span>
          <button id="btn-export-txt"  class="btn-secondary">TXT</button>
          <button id="btn-export-pdf"  class="btn-secondary">PDF</button>
          <button id="btn-export-json" class="btn-secondary">JSON</button>
        </div>
      </div>

      <!-- Error -->
      <div id="tr-error-row" class="hidden">
        <p id="tr-error-msg" class="error-msg"></p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
